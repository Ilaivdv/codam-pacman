[project]
name = "pacman"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"pygame-ce",
	"pydantic",
	"mazegenerator",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
mazegenerator = { path = "lib/mazegenerator-2.0.2-py3-none-any.whl" }
